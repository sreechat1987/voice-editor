<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Voice Editor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
    }
    textarea {
      width: 100%;
      height: 250px;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
      resize: vertical;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #start-btn { background-color: #28a745; color: white; }
    #stop-btn { background-color: #dc3545; color: white; }
    #copy-btn { background-color: #6c757d; color: white; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>My Voice-to-Text App</h2>
  <p>Click "Start Dictation" and begin reading. Your words will appear below.</p>
  
  <textarea id="transcription-box" placeholder="Your typed text will appear here..."></textarea>
  
  <div class="btn-group">
    <button id="start-btn">Start Dictation</button>
    <button id="stop-btn" disabled>Stop Dictation</button>
    <button id="copy-btn">Copy Text</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
